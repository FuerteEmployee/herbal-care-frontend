<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Outfit: geometric sans with a wide weight range. Loading 400–700 so
         table cells, labels and headings all have a real weight rather than a
         synthesised one. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <meta name="description" content="Herbal Gujarat Admin Panel — manage products, orders, leads, purchases, and deliveries." />
    <meta name="robots" content="noindex, nofollow" />
    <title>Herbal Gujarat Admin</title>
    <script>
      /*
       * Put the URL back after index.html handed us a deep link — see the
       * matching script there for why that handoff exists.
       *
       * Without this the panel would boot at /admin.html, which matches no
       * route, and the router's catch-all would send every deep link to the
       * dashboard. Runs before /src/main.jsx, which is a module and therefore
       * deferred, so the router reads the corrected location on its first
       * render and no redirect is ever visible.
       */
      (function restoreAdminRoute() {
        try {
          var route = sessionStorage.getItem('hg_admin_route');
          if (!route) return;
          // Cleared immediately: it applies to this navigation only, otherwise
          // opening the panel again later would jump to a stale URL.
          sessionStorage.removeItem('hg_admin_route');
          history.replaceState(null, '', route);
        } catch (err) {
          /* nothing handed over — the panel opens at its default page */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
