# nginx routing for herbalgujratcare.com
#
# This project builds TWO documents into dist/ (see vite.config.js):
#
#   index.html  → the storefront   (src/ecommerce)  owns  /
#   admin.html  → the admin panel  (src/main.jsx)   owns  /admin/*
#
# Both use BrowserRouter, so a deep link like /admin/login is not a file on
# disk — the server has to answer it with the right HTML document and let the
# router take over. A plain `try_files $uri /index.html` fallback answers it
# with the *storefront*, which has no /admin route and renders its not-found
# page. That is the bug this file fixes: the URL returns 200, it is just the
# wrong app.
#
# Paste the location blocks below into the `server { … }` block for this site
# (typically /etc/nginx/sites-available/herbalgujratcare.com), then:
#
#   sudo nginx -t && sudo systemctl reload nginx
#
# ORDER MATTERS. The /admin blocks must come before `location /`, or the
# storefront catch-all wins.

    # Adjust to wherever `npm run build` output is deployed.
    root /var/www/herbalgujratcare.com/dist;
    index index.html;

    # ── Admin panel ─────────────────────────────────────────────────────────
    # `^~` makes this prefix beat any regex location, so nothing further down
    # can steal /admin/* back. $uri is tried first so a real file under /admin/
    # would still be served if one is ever added.
    location = /admin {
        add_header Cache-Control "no-store";
        try_files /admin.html =404;
    }

    location ^~ /admin/ {
        add_header Cache-Control "no-store";
        try_files $uri /admin.html;
    }

    # Old top-level bookmark — the panel redirects it on to /admin/login.
    location = /login {
        add_header Cache-Control "no-store";
        try_files /admin.html =404;
    }

    # ── Build assets ────────────────────────────────────────────────────────
    # Filenames carry a content hash, so a given URL's contents never change
    # and it can be cached indefinitely. `=404` rather than a fallback: a
    # missing asset should fail loudly, not return HTML that the browser then
    # tries to parse as JavaScript.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── Storefront ──────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The HTML documents name the hashed assets, so a cached copy outlives the
    # build it belongs to and points at files that no longer exist — the classic
    # blank page after a deploy. Never cache them.
    #
    # Both are listed because try_files' fallback is an internal redirect, and
    # headers do not carry across one: /admin/orders lands here as /admin.html
    # and would otherwise pick up no header at all.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location = /admin.html {
        add_header Cache-Control "no-store";
    }

    # Netlify-only routing file. It has no meaning here and is currently served
    # as a public download; hide it.
    location = /_redirects {
        return 404;
    }
